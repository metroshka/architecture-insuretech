# GraphQL API сервиса client-info на основе Swagger 2.0, версия 1.0.0.
#
# Соответствие REST-операций:
# GET /clients/{id}           -> client(id) { id name age }
# GET /clients/{id}/documents -> client(id) { documents { ... } }
# GET /clients/{id}/relatives -> client(id) { relatives { ... } }
# Под «...» здесь подразумевается выбор нужных полей связанного объекта.
#
# В Swagger свойства объектов не отмечены как required: поля ответа nullable.
# Списки также nullable для возможности частичного ответа при ошибке загрузки.
# issueDate и expiryDate остаются String: формат дат в Swagger не задан.
# type и relationType остаются String: допустимые значения enum не заданы.
# Исходный контракт содержит только чтение, поэтому Mutation не требуется.

"""Операции чтения клиентских данных."""
type Query {
  """
  Клиент по ID. Документы и родственники выбираются вложенными полями.
  Принятое правило: если клиент не найден, возвращается null.
  """
  client(id: ID!): Client
}

"""Клиент и доступные для отдельного или совместного чтения связанные данные."""
type Client {
  """Идентификатор клиента."""
  id: ID

  """Имя клиента."""
  name: String

  """Возраст клиента."""
  age: Int

  """Документы этого клиента. При отсутствии документов возвращается пустой список."""
  documents: [Document]

  """Родственники этого клиента. При отсутствии родственников возвращается пустой список."""
  relatives: [Relative]
}

"""Документ клиента."""
type Document {
  """Идентификатор документа."""
  id: ID

  """Тип документа в строковом представлении исходного API."""
  type: String

  """Номер документа. Строка сохраняет ведущие нули и буквенные символы."""
  number: String

  """Дата выдачи в строковом представлении исходного API."""
  issueDate: String

  """Дата окончания действия в строковом представлении исходного API."""
  expiryDate: String
}

"""Сведения о родственнике клиента."""
type Relative {
  """Идентификатор записи о родственнике."""
  id: ID

  """Тип родства в строковом представлении исходного API."""
  relationType: String

  """Имя родственника."""
  name: String

  """Возраст родственника."""
  age: Int
}
